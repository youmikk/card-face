<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta http-equiv="Cache-Control" content="no-cache" />
  <title>卡面设计生成器</title>
  <link rel="icon" href="favicon.svg" type="image/svg+xml" />
   <link rel="stylesheet" href="styles.css?v=20260925c" />
</head>
<body>
  <header class="bar">
    <div class="brand">
      <svg class="mark" viewBox="0 0 42 28" aria-hidden="true"><rect width="42" height="28" rx="4" fill="#1b2b40"/><rect y="7" width="42" height="5" fill="#c9862d"/><rect x="4" y="16" width="10" height="7" rx="1.5" fill="#e7edf4"/></svg>
      <div><strong data-i18n="title">卡面设计生成器</strong></div>
    </div>
    <div class="switches">
      <button type="button" class="icon-btn" id="lang-toggle" aria-label="Language">EN</button>
      <button type="button" class="icon-btn" id="theme-toggle" aria-label="Theme">
        <svg class="sun" viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="4" fill="none" stroke="currentColor" stroke-width="2"/><path fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg>
        <svg class="moon" viewBox="0 0 24 24" aria-hidden="true"><path fill="currentColor" d="M15.5 3.1a8.5 8.5 0 1 0 5.4 12.8A7.2 7.2 0 0 1 15.5 3.1Z"/></svg>
      </button>
      <button type="button" class="icon-btn support" id="support" data-i18n-label="support" aria-label="赞赏"><svg viewBox="0 0 24 24" aria-hidden="true"><path fill="currentColor" d="M12 20s-7-4.4-7-9.2C5 8 6.8 6.2 9.2 6.2c1.3 0 2.4.6 2.8 1.6.4-1 1.5-1.6 2.8-1.6 2.4 0 4.2 1.8 4.2 4.6C19 15.6 12 20 12 20Z"/></svg></button>
      <a class="github" id="github" href="https://github.com/youmikk/card-face" target="_blank" rel="noreferrer" aria-label="GitHub"><svg viewBox="0 0 16 16" aria-hidden="true"><path fill="currentColor" fill-rule="evenodd" d="M8 0C3.58 0 0 3.58 0 8c0 3.54 2.29 6.53 5.47 7.59.4.07.55-.17.55-.38 0-.19-.01-.82-.01-1.49-2.01.37-2.53-.49-2.69-.94-.09-.23-.48-.94-.82-1.13-.28-.15-.68-.52-.01-.53.63-.01 1.08.58 1.23.82.72 1.21 1.87.87 2.33.66.07-.52.28-.87.51-1.07-1.78-.2-3.64-.89-3.64-3.95 0-.87.31-1.59.82-2.15-.08-.2-.36-1.02.08-2.12 0 0 .67-.21 2.2.82.64-.18 1.32-.27 2-.27.68 0 1.36.09 2 .27 1.53-1.04 2.2-.82 2.2-.82.44 1.1.16 1.92.08 2.12.51.56.82 1.27.82 2.15 0 3.07-1.87 3.75-3.65 3.95.29.25.54.73.54 1.48 0 1.07-.01 1.93-.01 2.2 0 .21.15.46.55.38A8.013 8.013 0 0016 8c0-4.42-3.58-8-8-8z"/></svg></a>
    </div>

  </header>

  <div class="layout">
    <section class="preview">
      <div class="head"><h2 data-i18n="preview">卡面预览</h2><div class="head-actions"><button type="button" id="save-card" class="export" data-i18n="save">保存</button><button type="button" id="export" class="export" data-i18n="export">导出 PNG</button></div></div>
      <div class="stage">
         <div class="card round" id="card">
          <canvas id="base" width="1536" height="969"></canvas>
          <canvas id="reference" width="1536" height="969"></canvas>
          <div id="layers"></div>
          <div class="empty" id="empty">
            <strong data-i18n="emptyTitle">上传一张图片作为卡面</strong>
            <p data-i18n="emptyText">图片会按 1.586 : 1 铺满并居中，之后可以缩放和拖动调整构图。</p>
            <button type="button" id="pick-empty" data-i18n="choose">选择图片</button>
          </div>
        </div>

      </div>
      <div class="foot">
         <label class="check"><input id="rounded" type="checkbox" checked /> <span data-i18n="rounded">3.18 mm 圆角</span></label>
         <div class="modes" id="modes" role="group">
           <button type="button" data-mode="card" class="active" aria-label="拖动卡面" data-i18n-label="dragCard">
             <svg viewBox="0 0 24 24"><rect x="3" y="6" width="18" height="12" rx="2" fill="none" stroke="currentColor" stroke-width="1.8"/><path d="M8 12h8M12 9v6" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/></svg>
             <span data-i18n="dragCard">拖动卡面</span>
           </button>
           <button type="button" data-mode="reference" aria-label="拖动参考图" data-i18n-label="dragRef">
             <svg viewBox="0 0 24 24"><rect x="6" y="4" width="14" height="10" rx="1.6" fill="none" stroke="currentColor" stroke-width="1.8" opacity=".45"/><rect x="3" y="9" width="14" height="10" rx="1.6" fill="none" stroke="currentColor" stroke-width="1.8"/></svg>
             <span data-i18n="dragRef">拖动参考图</span>
           </button>
         </div>
        <div class="foot-actions">
          <button type="button" id="reset-zoom" class="quiet icon-action" data-i18n-label="resetZoom" aria-label="复原">
            <svg viewBox="0 0 24 24" aria-hidden="true"><path fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" d="M4 12a8 8 0 1 0 2.3-5.6M4 4v5h5"/><path fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" d="M9 12h6"/></svg>
          </button>
          <button type="button" id="clear" class="quiet" data-i18n="clear">清空</button>
        </div>
      </div>
      <div class="pickers">
       <section class="face-strip">
         <div class="head"><h2 data-i18n="cardImage">卡面图片</h2><div class="head-actions"><button type="button" class="pick" id="pick-card" data-i18n="choose">选择图片</button><button type="button" class="request" id="request-face" data-i18n="requestFace">提交卡面</button></div></div>
         <div class="tabs" id="face-cats"></div>
         <div class="library faces" id="faces"></div>
         <input id="photo" type="file" accept="image/*,.svg" hidden />
         <p class="note" data-i18n="cardNote">图片会等比缩放并居中填满卡面，超出部分自动裁掉。</p>
       </section>
      <section class="logo-panel">
         <div class="head"><h2>Logo <span id="logo-count">0</span></h2><button type="button" class="request" id="request-logo" data-i18n="requestLogo">提交 logo</button></div>
        <label class="drop compact" id="logo-drop">
          <strong data-i18n="uploadLogo">上传自己的 logo</strong>
          <small id="logo-hint" data-i18n="logoNeed">请先上传卡面图片</small>
          <input id="logo-file" type="file" accept="image/*,.svg" multiple disabled />
        </label>
        <div class="tabs" id="tabs"></div>
        <label class="bank-picker"><span data-i18n="banks">银行</span><select id="bank-picker"></select></label>
        <div class="library" id="library"></div>
      </section>
      </div>
    </section>

    <aside>
       <section class="saves">
         <div class="head"><h2 data-i18n="savedCards">保存区</h2><button type="button" id="export-all" class="pick" data-i18n="exportAll">全部导出</button></div>
         <div class="library faces" id="saves"></div>
         <p class="note" data-i18n="saveNote">点保存记下当前卡面。点缩略图可以再打开修改。只存在这台浏览器里。</p>
       </section>

      <section>
        <div class="head"><h2 data-i18n="reference">参考图</h2><span>1.586 : 1</span></div>
        <label class="drop">
          <strong data-i18n="dropRef">拖拽参考图到此处，或点击选择</strong>
          <small data-i18n="refHint">只用于对位，不会出现在导出的 PNG 里</small>
          <input id="ref-file" type="file" accept="image/*,.svg" />
        </label>
        <div id="ref-controls" hidden>
          <label class="check"><input id="ref-show" type="checkbox" checked /> <span data-i18n="showRef">显示参考图</span></label>
          <label><span data-i18n="opacity">透明度</span> <input id="ref-opacity" type="range" min="10" max="100" value="45" /></label>
          <button type="button" id="fit-ref" data-i18n="refit">重新匹配</button>
        </div>
      </section>

      <section>
        <h2 data-i18n="adjust">调整</h2>
        <div id="props"><p class="muted" data-i18n="selectLogo">点击卡面上的 logo 进行编辑</p></div>
        <div id="editor" hidden>
          <p id="obj-name" class="obj-name"></p>
          <label><span data-i18n="size">大小</span> <input id="scale" type="range" min="36" max="520" value="140" /></label>
          <label><span data-i18n="rotate">旋转</span> <input id="rotate" type="range" min="-180" max="180" value="0" /></label>
          <label><span data-i18n="opacity">透明度</span> <input id="opacity" type="range" min="10" max="100" value="100" /></label>
          <label class="check"><input id="lock" type="checkbox" /> <span data-i18n="lock">锁定</span></label>
          <div class="pair">
            <button type="button" id="layer-up" data-i18n="up">上移</button>
            <button type="button" id="layer-down" data-i18n="down">下移</button>
            <button type="button" id="remove" data-i18n="delete">删除</button>
          </div>
        </div>
      </section>

      <section>
        <div class="head"><h2 data-i18n="layers">图层</h2><span id="layer-count">0</span></div>
        <div id="layer-list" class="layers"><p class="muted" data-i18n="noLogo">暂无 logo</p></div>
      </section>

      <p class="legal" data-i18n="legal">输出只是视觉设计文件，不代表任何机构发行的卡片。图标来自公开素材库，使用前请确认你有相应授权。</p>
    </aside>
  </div>
  <div class="toast" id="toast" hidden role="status"></div>
  <div class="sheet terms" id="terms-sheet" hidden>
    <div class="sheet-card" role="dialog" aria-modal="true" aria-labelledby="terms-title">
      <h2 id="terms-title" data-i18n="termsTitle">使用条款</h2>
      <div class="terms-body" id="terms-body"></div>
      <button type="button" id="terms-accept" data-i18n="termsAccept">我已阅读并同意</button>
    </div>
  </div>
  <div class="sheet" id="submit-sheet" hidden>
    <div class="sheet-card" role="dialog" aria-modal="true" aria-labelledby="submit-title">
      <div class="head"><h2 id="submit-title" data-i18n="submitTitle">提交</h2><button type="button" class="quiet" id="submit-close" data-i18n="close">关闭</button></div>
      <form id="submit-form" class="submit-form">
        <label><span data-i18n="submitName">名称</span><input id="submit-name" type="text" maxlength="40" required /></label>
        <label><span data-i18n="submitKind">类型</span><select id="submit-kind"></select></label>
        <label><span data-i18n="submitCategory">分类</span><select id="submit-category"></select></label>
        <label id="submit-bank-row"><span data-i18n="banks">银行</span><select id="submit-bank"></select></label>
        <label id="submit-custom-row" hidden><span data-i18n="submitCustom">自定义分类</span><input id="submit-custom" type="text" maxlength="24" placeholder="例如：银行卡" /></label>
        <label><span data-i18n="submitFile">图片</span><input id="submit-file" type="file" accept="image/png,image/jpeg,image/webp,image/svg+xml,.svg" required /></label>
        <p class="note" id="submit-note"></p>
        <p class="note" id="submit-status" hidden></p>
        <button type="submit" class="export" id="submit-send" data-i18n="submitSend">发送</button>
      </form>
    </div>
  </div>
  <div class="sheet" id="support-sheet" hidden>
    <div class="sheet-card" role="dialog" aria-modal="true" aria-labelledby="support-title">
      <div class="head"><h2 id="support-title" data-i18n="support">赞赏</h2><button type="button" class="quiet" id="support-close" data-i18n="close">关闭</button></div>
      <div class="support-choices">
        <a class="support-link" href="https://afdian.com/a/youmikk" target="_blank" rel="noreferrer" data-i18n="afdian">爱发电</a>
        <button type="button" class="active" id="show-wechat" data-i18n="wechatSupport">微信赞赏码</button>
      </div>
      <figure id="wechat-code">
        <img src="assets/support-wechat.jpg" alt="微信赞赏码" />
      </figure>
    </div>
  </div>
   <script src="app.js?v=20260925e"></script>
 </body>
</html>
