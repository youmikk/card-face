name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  intake-tests:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: intake
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      # intake 没有运行时依赖，直接跑 node --test 即可
      - run: npm test
